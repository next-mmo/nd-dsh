<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ND Ad Block</title>
    <style>
      :root { color-scheme: dark light; }
      body {
        margin: 0;
        padding: 14px 16px;
        width: 260px;
        font: 12px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 { margin: 0 0 2px; font-size: 13px; font-weight: 600; }
      .state { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; }
      .dot.off { background: #9ca3af; }
      dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; }
      dt { color: #6b7280; }
      dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
      p { margin: 10px 0 0; color: #6b7280; }
      code { font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>ND Ad Block</h1>
    <div class="state"><span class="dot" id="dot"></span><span id="state">Checking…</span></div>
    <dl>
      <dt>Rule sets</dt><dd id="rulesets">—</dd>
      <dt>Ad rules</dt><dd id="rules">—</dd>
      <dt>Ad breaks ended</dt><dd id="adBreaks">—</dd>
      <dt>Ad entries stripped</dt><dd id="pruned">—</dd>
    </dl>
    <p id="note"></p>
    <script src="popup.js"></script>
  </body>
</html>
