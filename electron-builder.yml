appId: com.nddsh.desktop
productName: ND-DSH
copyright: Copyright (c) 2026 ND-DSH contributors

directories:
  output: dist

asar: true
npmRebuild: false
# The ND launcher extracts the compressed archive once into a unique directory.
compression: normal
afterPack: scripts/check-release-payload.cjs
afterAllArtifactBuild: scripts/check-release-size.cjs
files:
  - out/**
  - package.json
  - node_modules/**
  - '!node_modules/.cache/**'

extraResources:
  - from: .release/node
    to: node
  - from: .release/release-manifest.json
    to: release-manifest.json
  - from: .release/THIRD_PARTY_NOTICES.nd-dsh.md
    to: THIRD_PARTY_NOTICES.nd-dsh.md
  - from: .release/nd-core
    to: nd-core
  - from: .release/nd-agent
    to: nd-agent
  - from: .release/nd-browser-host
    to: nd-browser-host
  - from: extensions/browser-companion
    to: browser-companion
  - from: extensions/quit-process
    to: nd-extensions/quit-process
  - from: extensions/translate
    to: nd-extensions/translate
  - from: extensions/clipboard-history
    to: nd-extensions/clipboard-history
  - from: extensions/password-vault
    to: nd-extensions/password-vault
  - from: .release/harness
    to: vendor/deepseek-harness
  - from: .release/harness/node_modules
    to: vendor/deepseek-harness/node_modules
    filter:
      - "**/*"
  - from: configs/dsh
    to: configs/dsh
  - from: scripts
    to: scripts
    filter:
      - external-inspect-mcp.mjs
      - install-harness-runtime.mjs
      - nd-extension-mcp.mjs
      - nd-extension-runtime.mjs
      - nd-browser-companion-runtime.mjs
      - nd-agent-browser-cli.mjs
      - nd-background-process.cjs
      - register-browser-native-host.mjs
  - from: node_modules/agent-browser
    to: node_modules/agent-browser
    filter:
      - '**/*'
      - '!bin/agent-browser-linux*'
      - '!bin/agent-browser-darwin*'
  - from: resources/browser-extensions
    to: browser-extensions
    filter:
      - '**/*'
      # Chromium's generated rule-set index; it is rebuilt per profile at runtime.
      - '!**/_metadata/**'
  - from: resources/nd-pencil
    to: nd-pencil
  - from: resources/nd-bundles
    to: nd-bundles
  - from: LICENSE
    to: LICENSE.nd-dsh

win:
  target:
    - nsis
  artifactName: ND-DSH-${version}-${os}-${arch}.${ext}

nsis:
  artifactName: ND-DSH-${version}-private-beta-${arch}.${ext}
  script: scripts/nd-portable-launcher.nsi
  differentialPackage: false
  perMachine: false
