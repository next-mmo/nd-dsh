<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <!-- Mirrors the CSP the ND asset server sets on this document; defense in depth. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src nd-extension-ui:; style-src nd-extension-ui: 'unsafe-inline'; img-src nd-extension-ui: data: blob:; font-src nd-extension-ui:; connect-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>OS Toolkit</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #131519;
      --panel: #1b1e25;
      --panel-2: #21252e;
      --border: #2a2f3a;
      --border-strong: #3d4452;
      --text: #e7e9ee;
      --faint: #9aa3b2;
      --sun: #fbbf24;
      --moon: #a78bfa;
      --ok: #4ade80;
      --warn: #fb923c;
    }
    :root[data-theme='light'] {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-2: #f0f2f5;
      --border: #d8dde6;
      --border-strong: #c2c9d6;
      --text: #1d1d1f;
      --faint: #6e6e73;
      --sun: #d97706;
      --moon: #7c3aed;
      --ok: #15803d;
      --warn: #c2410c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px 16px 18px;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      user-select: none;
    }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
    .subtitle { margin: 2px 0 0; font-size: 11.5px; color: var(--faint); }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--panel);
      font-size: 11px; font-weight: 600; color: var(--faint);
    }
    .badge b { color: var(--text); font-weight: 650; }
    .badge.sun b { color: var(--sun); }
    .badge.moon b { color: var(--moon); }

    section { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); padding: 12px 13px; }
    .section-title { margin: 0 0 9px; font-size: 11px; font-weight: 650; color: var(--faint); text-transform: uppercase; letter-spacing: 0.05em; }

    /* --- timeline --- */
    .timeline { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    #ring { width: 148px; height: 148px; flex: none; display: block; }
    .timeline-readout { flex: 1; min-width: 190px; display: flex; flex-direction: column; gap: 6px; }
    .countdown { font-size: 17px; font-weight: 650; letter-spacing: -0.015em; }
    .countdown span { color: var(--faint); font-weight: 500; }
    .legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--faint); flex-wrap: wrap; }
    .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
    .legend .l-sun i { background: var(--sun); }
    .legend .l-moon i { background: var(--moon); }
    .issue { font-size: 12px; color: var(--warn); }

    /* --- controls --- */
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .row + .row { margin-top: 9px; }
    .label { font-size: 11.5px; color: var(--faint); min-width: 96px; }
    button {
      font: inherit; color: var(--text); background: var(--panel-2);
      border: 1px solid var(--border); border-radius: 7px;
      padding: 5px 11px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
    }
    button:hover:not(:disabled) { border-color: var(--border-strong); }
    button:disabled { opacity: 0.42; cursor: default; }
    button.on { border-color: var(--sun); color: var(--sun); }
    button.primary { border-color: var(--ok); color: var(--ok); font-weight: 600; }
    button svg { width: 13px; height: 13px; flex: none; }
    input[type='time'], input[type='text'] {
      font: inherit; color: var(--text); background: var(--panel-2);
      border: 1px solid var(--border); border-radius: 7px; padding: 4px 8px;
    }
    input[type='time']:focus, input[type='text']:focus, button:focus-visible {
      outline: 2px solid var(--moon); outline-offset: 1px;
    }
    label.check { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; }
    label.check input { accent-color: var(--moon); width: 14px; height: 14px; }

    /* --- status --- */
    #status {
      min-height: 20px; font-size: 12px; display: flex; align-items: center;
      gap: 9px; flex-wrap: wrap;
    }
    #status.ok { color: var(--ok); }
    #status.bad { color: var(--warn); }
    #status:empty { display: none; }
    .note { font-size: 11px; color: var(--faint); }
    .stack { display: flex; flex-direction: column; gap: 6px; }
    a { color: var(--moon); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>OS Toolkit</h1>
      <p class="subtitle">Day/night Windows theme, on your own schedule.</p>
    </div>
    <div class="badges">
      <span class="badge" id="badge-theme">Windows theme <b>&mdash;</b></span>
      <span class="badge" id="badge-backend">Backend <b>&mdash;</b></span>
    </div>
  </header>

  <div id="status" role="status" aria-live="polite"></div>

  <section>
    <h2 class="section-title">Today</h2>
    <div class="timeline">
      <canvas id="ring" width="296" height="296" role="img"
        aria-label="A 24 hour ring showing when Windows is in light and dark mode"></canvas>
      <div class="timeline-readout">
        <div class="countdown" id="countdown">&mdash;</div>
        <div class="legend">
          <span class="l-sun"><i></i>Light <b id="legend-day">&mdash;</b></span>
          <span class="l-moon"><i></i>Dark <b id="legend-night">&mdash;</b></span>
        </div>
        <div class="issue" id="issue" hidden></div>
      </div>
    </div>
  </section>

  <section>
    <h2 class="section-title">Change it now</h2>
    <div class="row">
      <button id="act-light" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        Light now
      </button>
      <button id="act-dark" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        Dark now
      </button>
      <button id="act-toggle" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 6h18"/><path d="M7 22l-4-4 4-4"/><path d="M21 18H3"/></svg>
        Toggle
      </button>
      <span class="note" id="apply-note"></span>
    </div>
  </section>

  <section>
    <h2 class="section-title">Schedule</h2>
    <div class="stack">
      <div class="row">
        <label class="check">
          <input type="checkbox" id="set-schedulerEnabled" />
          Run the day/night schedule
        </label>
      </div>
      <div class="row">
        <span class="label" id="label-day">Light starts</span>
        <input type="time" id="set-dayStart" aria-labelledby="label-day" />
        <span class="label" id="label-night">Dark starts</span>
        <input type="time" id="set-nightStart" aria-labelledby="label-night" />
      </div>
      <div class="row">
        <span class="label">Applies to</span>
        <label class="check"><input type="checkbox" id="set-applySystem" /> Taskbar &amp; system</label>
        <label class="check"><input type="checkbox" id="set-applyApps" /> Apps</label>
      </div>
      <div class="row">
        <span class="label">Repair</span>
        <label class="check"><input type="checkbox" id="set-startupReconcile" /> Apply the right theme when ND starts or wakes</label>
      </div>
    </div>
  </section>

  <section>
    <h2 class="section-title">Backend</h2>
    <div class="stack">
      <div class="row" role="group" aria-label="Apply backend">
        <span class="label">Apply using</span>
        <button id="backend-auto" type="button" disabled>Auto</button>
        <button id="backend-native" type="button" disabled>Native</button>
        <button id="backend-powertoys" type="button" disabled>PowerToys</button>
      </div>
      <div class="row">
        <span class="label">Why</span>
        <span class="note" id="backend-reason">&mdash;</span>
      </div>
      <div class="row">
        <span class="label">Light Switch</span>
        <span class="note" id="lightswitch-state">&mdash;</span>
      </div>
      <div class="row">
        <label class="check">
          <input type="checkbox" id="set-lightSwitchSync" />
          Turn off Light Switch's own schedule so the two cannot fight
        </label>
      </div>
    </div>
  </section>

  <div class="row">
    <button id="save" class="primary" type="button" disabled>Save schedule</button>
    <button id="refresh" type="button" disabled>Refresh</button>
    <span class="note">The schedule only runs while ND is open.</span>
  </div>

  <script type="module" src="./studio.js"></script>
</body>
</html>
