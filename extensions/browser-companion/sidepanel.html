<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ND Browser Companion</title>
  <style>
    :root{--bg:#f6f6f8;--card:#fff;--border:rgba(28,28,32,.11);--text:#1d1d1f;--muted:#6e6e73;--btn:#fff;--ok:#248a3d;--bad:#ff3b30;--ring:#007aff}
    @media(prefers-color-scheme:dark){:root{--bg:#101115;--card:#191a1f;--border:rgba(255,255,255,.11);--text:#f5f5f7;--muted:#8e8e93;--btn:#22232a;--ok:#30d158;--bad:#ff453a;--ring:#0a84ff}}
    body{font:13px/1.45 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;margin:0;padding:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
    h1{font-size:15px;font-weight:600;letter-spacing:-.015em;margin:0 0 12px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px;margin:0 0 10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
    .row{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:var(--muted);font-size:12px;margin-top:2px}
    button{font:inherit;font-size:12px;font-weight:500;color:var(--text);border:1px solid var(--border);border-radius:8px;background:var(--btn);padding:6px 11px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.06)}button:disabled{opacity:.45;cursor:default}
    input{font:inherit;color:var(--text);background:var(--bg);width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:8px;padding:6px 9px;margin-top:6px;outline:none}input:focus{border-color:var(--ring)}
    .ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
  </style>
</head>
<body>
  <h1>ND Browser Companion</h1>
  <div class="card">
    <div class="row"><strong>ND desktop</strong><span id="status">Checking…</span></div>
    <div class="muted" id="site">No active web tab</div>
  </div>
  <div class="card">
    <strong>Profile label</strong>
    <div class="muted">Shown in ND when several browser profiles are connected.</div>
    <input id="profile" maxlength="128" placeholder="Chrome Personal">
    <div style="margin-top:8px"><button id="saveProfile">Save label</button></div>
  </div>
  <div class="card">
    <strong>Site access</strong>
    <div class="muted" id="permissionText">Open an http/https tab to grant access.</div>
    <div style="margin-top:8px"><button id="allowSite" disabled>Allow current site</button></div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
