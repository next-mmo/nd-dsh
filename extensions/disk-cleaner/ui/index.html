<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <!-- Mirrors the CSP the ND asset server sets on this document; defense in depth. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src nd-extension-ui:; style-src nd-extension-ui: 'unsafe-inline'; img-src nd-extension-ui: data: blob:; font-src nd-extension-ui:; connect-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>ND Disk Cleaner</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #131519;
      --panel: #1b1e25;
      --border: #2a2f3a;
      --text: #e7e9ee;
      --faint: #9aa3b2;
      --accent: #38bdf8;
      --danger: #f87171;
      --ok: #4ade80;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 14px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      user-select: none;
    }
    header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .label { font-size: 11px; color: var(--faint); }
    input, select {
      font: inherit;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 5px 9px;
    }
    #path { flex: 1; min-width: 220px; }
    button {
      font: inherit;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 5px 11px;
      cursor: pointer;
    }
    button:hover { border-color: #3d4452; }
    button:disabled { opacity: 0.45; cursor: default; }
    button.primary { border-color: var(--accent); color: var(--accent); }
    #progress { display: flex; align-items: center; gap: 10px; min-height: 22px; }
    #progress-track {
      flex: 1;
      height: 6px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 180ms ease;
    }
    #progress-fill.busy { animation: breathe 1.1s ease-in-out infinite alternate; }
    @keyframes breathe { from { opacity: 0.55; } to { opacity: 1; } }
    #progress-text { min-width: 190px; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
    #breadcrumb { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; min-height: 22px; }
    .crumb {
      border: 0;
      background: none;
      padding: 2px 6px;
      border-radius: 6px;
      color: var(--accent);
      font-size: 12px;
    }
    .crumb:hover { background: var(--panel); }
    .crumb-sep { color: var(--faint); font-size: 11px; }
    main { flex: 1; display: flex; gap: 10px; min-height: 260px; }
    #chart {
      position: relative;
      flex: 1.1;
      min-width: 220px;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    #sunburst { display: block; width: 100%; height: 100%; cursor: pointer; }
    #panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    #panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      color: var(--faint);
    }
    #rows { flex: 1; overflow-y: auto; padding: 4px 0; }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 90px 72px auto;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      cursor: pointer;
      border-left: 2px solid transparent;
    }
    .row:hover { background: rgba(56, 189, 248, 0.08); border-left-color: var(--accent); }
    .row-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-name.dir { font-weight: 600; }
    .row-name.other { color: var(--faint); font-style: italic; }
    .row-bar {
      height: 6px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .row-bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }
    .row-size { text-align: right; color: var(--faint); font-variant-numeric: tabular-nums; }
    .row-action {
      padding: 2px 8px;
      font-size: 11px;
      border-radius: 6px;
      margin-left: 4px;
    }
    .row-action.trash { color: var(--danger); border-color: rgba(248, 113, 113, 0.4); }
    footer { display: flex; justify-content: space-between; gap: 8px; min-height: 20px; }
    #status { color: var(--faint); font-size: 12px; }
    #toasts {
      position: fixed;
      bottom: 38px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }
    .toast {
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(27, 30, 37, 0.92);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      animation: toast-in 180ms ease-out;
    }
    .toast.ok { border-color: var(--ok); color: var(--ok); }
    .toast.error { border-color: var(--danger); color: var(--danger); }
    .toast.leaving { opacity: 0; transform: translateY(4px); transition: opacity 240ms ease, transform 240ms ease; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <header>
    <span class="label">Volume</span>
    <select id="volume" aria-label="Volume"></select>
    <span class="label">Folder</span>
    <input id="path" type="text" spellcheck="false" aria-label="Folder to scan" placeholder="Absolute folder path to scan" />
    <button id="scan" class="primary" type="button" disabled>Scan</button>
    <button id="cancel" type="button" disabled>Cancel</button>
  </header>

  <div id="progress">
    <div id="progress-track"><div id="progress-fill"></div></div>
    <div id="progress-text" role="status" aria-live="polite"></div>
  </div>

  <nav id="breadcrumb" aria-label="Scan location"></nav>

  <main>
    <div id="chart"><canvas id="sunburst" aria-label="Disk usage sunburst"></canvas></div>
    <section id="panel">
      <div id="panel-head">
        <span>Biggest items</span>
        <span>Size · Reveal · Trash</span>
      </div>
      <div id="rows"></div>
    </section>
  </main>

  <footer>
    <div id="status" role="status" aria-live="polite"></div>
    <div class="label">Esc cancels a scan · click a ring to zoom</div>
  </footer>

  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
