<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <!-- Mirrors the CSP the ND asset server sets on this document; defense in depth. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src nd-extension-ui:; style-src nd-extension-ui: 'unsafe-inline'; img-src nd-extension-ui: data: blob:; font-src nd-extension-ui:; connect-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Mini Browser</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #131519;
      --panel: #1b1e25;
      --border: #2a2f3a;
      --text: #e7e9ee;
      --faint: #9aa3b2;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 12px 14px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      user-select: none;
    }
    #address-row { display: flex; gap: 6px; }
    #address {
      flex: 1;
      min-width: 0;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px;
    }
    #address:focus { outline: none; border-color: var(--accent); }
    button {
      font: inherit;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 5px 11px;
      cursor: pointer;
    }
    button:hover { border-color: #3d4452; }
    button:disabled { opacity: 0.45; cursor: default; }
    #status { min-height: 19px; font-weight: 600; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #status.error { color: var(--accent); }
    .section { color: var(--faint); font-size: 10px; font-weight: 800; letter-spacing: 0.09em; margin: 2px 0 0; }
    #tabs { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 64px; flex: 1.2; display: flex; flex-direction: column; gap: 5px; }
    #links { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 64px; flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 9px;
    }
    .row.active { border-color: var(--accent); }
    .row.sleeping { opacity: 0.62; }
    .badge {
      display: grid;
      place-items: center;
      width: 36px;
      height: 26px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.13);
      color: var(--accent);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.04em;
      flex: none;
    }
    .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .addr { color: var(--faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill { flex: none; padding: 3px 9px; font-size: 11px; }
    .pill:focus-visible { outline: 1px solid var(--accent); }
    .sleep-tag { flex: none; color: var(--faint); font-size: 10px; letter-spacing: 0.05em; }
    .drop { flex: none; width: 26px; padding: 4px 0; font-size: 12px; color: var(--faint); }
    .drop:hover { color: var(--accent); }
    .empty { color: var(--faint); text-align: center; padding: 14px 10px; border: 1px dashed var(--border); border-radius: 9px; }
    footer { color: var(--faint); font-size: 11px; }
  </style>
</head>
<body>
  <div id="address-row">
    <input id="address" type="text" placeholder="Type an address to open in a new tab…" spellcheck="false" />
    <button id="open" type="button">Open tab</button>
  </div>
  <p id="status" role="status"></p>
  <p class="section">TABS · ND BROWSER SESSION</p>
  <ul id="tabs" aria-label="Open tabs"></ul>
  <p class="section">QUICK LINKS</p>
  <ul id="links" aria-label="Quick links"></ul>
  <footer>Open runs a real tab of the ND built-in browser and takes you there — the chrome hides itself but stays alive on its header tab.</footer>
  <script type="module" src="./chrome.js"></script>
</body>
</html>
