<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <!-- Mirrors the CSP the ND asset server sets on this document; defense in depth. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src nd-extension-ui:; style-src nd-extension-ui: 'unsafe-inline'; img-src nd-extension-ui: data: blob:; font-src nd-extension-ui:; connect-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>ND Video Gen</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d13;
      --surface: #121622;
      --surface-2: #181d2c;
      --border: #272e42;
      --text: #eef1f8;
      --muted: #98a2bd;
      --accent: #22d3ee;
      --accent-2: #a855f7;
      --warm: #fb923c;
      --ok: #34d399;
      --danger: #f87171;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f1f4fa;
      --surface: #ffffff;
      --surface-2: #f5f7fb;
      --border: #c3ccdb;
      --text: #172138;
      --muted: #4a576e;
      --accent: #086f83;
      --accent-2: #6937b3;
      --warm: #ab521c;
      --ok: #0b7151;
      --danger: #a52a37;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(circle at 18% 12%, rgba(34, 211, 238, 0.08), transparent 42%),
                  radial-gradient(circle at 84% 88%, rgba(168, 85, 247, 0.09), transparent 46%),
                  var(--bg);
      color: var(--text);
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 12px 14px;
      overflow: hidden;
    }
    .studio {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(220px, 300px) minmax(260px, 1fr);
      gap: 14px;
      align-items: stretch;
    }
    .stage-pane {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #0d1018 0%, #07090e 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      min-height: 0;
      overflow: hidden;
    }
    .canvas-shell {
      position: relative;
      height: 100%;
      max-height: 100%;
      aspect-ratio: 9 / 16;
      max-width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.65);
      background: #07080d;
    }
    #composite-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .stage-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #cbd5e1;
      background: rgba(11, 13, 19, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      pointer-events: none;
    }
    #webgl-fallback {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 18px;
      background: rgba(7, 9, 14, 0.94);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .pill {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 2px 8px;
      border-radius: 999px;
      color: var(--accent);
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.28);
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }
    input[type="text"], textarea, select {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font: inherit;
      padding: 7px 9px;
      outline: none;
      resize: none;
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }
    input:disabled, textarea:disabled, select:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .model-row { display: flex; gap: 6px; }
    .model-row select { min-width: 0; }
    .model-row button { flex: none; }
    .between {
      justify-content: space-between;
    }
    button {
      font: inherit;
      font-weight: 600;
      font-size: 12px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 11px;
      cursor: pointer;
      transition: border-color 120ms ease, background 120ms ease, opacity 120ms ease;
    }
    button:hover:not(:disabled) { border-color: #465272; }
    button:disabled { opacity: 0.42; cursor: default; }
    button.on {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(34, 211, 238, 0.1);
    }
    button.primary {
      background: linear-gradient(135deg, #0ea5e9 0%, #8b5cf6 100%);
      border-color: transparent;
      color: #ffffff;
    }
    button.primary:hover:not(:disabled) {
      filter: brightness(1.08);
    }
    button.save-ready {
      border-color: rgba(52, 211, 153, 0.55);
      background: rgba(52, 211, 153, 0.14);
      color: var(--ok);
    }
    button.danger {
      border-color: rgba(248, 113, 113, 0.5);
      color: var(--danger);
      background: rgba(248, 113, 113, 0.1);
    }
    .timecode {
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      color: var(--muted);
      margin-left: auto;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: #0d1018;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 65%, var(--warm) 100%);
      transition: width 70ms linear;
    }
    .status {
      font-size: 11px;
      color: var(--muted);
      min-height: 16px;
      line-height: 1.4;
    }
    .status.ok { color: var(--ok); }
    .status.error { color: var(--danger); }
    @media (max-width: 620px) {
      body { overflow-y: auto; }
      .studio { grid-template-columns: 1fr; height: auto; }
      .stage-pane { height: 320px; }
    }
  </style>
</head>
<body>
  <main class="studio">
    <section class="stage-pane" aria-label="9:16 Video Preview">
      <div class="canvas-shell">
        <canvas id="composite-canvas" width="720" height="1280"></canvas>
        <div class="stage-badge">720×1280 · 30 FPS</div>
        <div id="webgl-fallback" role="alert"></div>
      </div>
    </section>

    <section class="controls" aria-label="Studio Controls">
      <div class="card">
        <div class="field">
          <label class="field-top" for="model-select">Text model</label>
          <div class="model-row">
            <select id="model-select" disabled>
              <option value="">Choose a model</option>
            </select>
            <button id="refresh-models" type="button" disabled>Refresh</button>
          </div>
        </div>
        <div class="field">
          <label class="field-top" for="brief-input">Video brief</label>
          <textarea id="brief-input" rows="2" maxlength="500" placeholder="A tiny lantern lights up a sleepy village"></textarea>
        </div>
        <button id="generate-scene" type="button" class="primary" disabled>Generate scene settings</button>
        <div id="generation-status" class="status" role="status">Connecting to ND Router…</div>
      </div>
      <div class="card">
        <div class="header-row">
          <span class="title">Kinetic Studio Orb</span>
          <span class="pill">9:16 Editorial</span>
        </div>

        <div class="field">
          <div class="field-top">
            <label for="hook-input">Hook headline (burned into video)</label>
            <span id="hook-count">0/72</span>
          </div>
          <textarea id="hook-input" rows="2" maxlength="72" placeholder="Enter your opening hook…" disabled></textarea>
        </div>

        <div class="field">
          <div class="field-top">
            <label for="cta-input">Call to action (burned into video)</label>
            <span id="cta-count">0/36</span>
          </div>
          <input id="cta-input" type="text" maxlength="36" placeholder="Enter call to action…" disabled />
        </div>

        <div class="field">
          <label class="field-top" for="palette-select">Color palette</label>
          <select id="palette-select" disabled>
            <option value="neon">Neon</option>
            <option value="sunset">Sunset</option>
            <option value="aurora">Aurora</option>
          </select>
        </div>

        <div class="field">
          <div class="field-top">
            <span>Duration</span>
            <span class="pill" id="codec-label">WebM</span>
          </div>
          <div class="row" role="group" aria-label="Clip duration">
            <button type="button" class="duration-btn" data-duration="4" disabled>4s</button>
            <button type="button" class="duration-btn on" data-duration="6" disabled>6s</button>
            <button type="button" class="duration-btn" data-duration="8" disabled>8s</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="field-top">
          <span>Preview Playback</span>
          <span class="timecode" id="timecode">0.0s / 6.0s</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="preview-bar"></div>
        </div>
        <div class="row">
          <button id="play-pause" type="button" class="on" disabled>Pause</button>
          <button id="replay" type="button" disabled>Replay</button>
        </div>
      </div>

      <div class="card">
        <div class="field-top">
          <span>Export 720×1280 WebM</span>
          <span id="render-pct">Idle</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="render-bar"></div>
        </div>
        <div class="row between">
          <div class="row">
            <button id="render-btn" type="button" class="primary" disabled>Render video</button>
            <button id="cancel-btn" type="button" class="danger" hidden>Cancel</button>
          </div>
          <button id="save-btn" type="button" disabled>Save</button>
        </div>
        <div id="status" class="status" role="status" aria-live="polite">Initializing studio…</div>
      </div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
